name: Проверка настоящей службы AWG Go

on:
  pull_request:
    paths:
      - vsrv-admin.py
      - vcli-admin.py
      - tests_local/test_lanfabric_awg_go.py
      - tests_local/test_lanfabric_go_installation.py
      - tests_integration/run_awg_go_ci.py
      - .github/workflows/awg-go-checks.yml
      - deployment/build_go_components.py
      - deployment/publish_go_components.py
  push:
    branches: [master]
    paths:
      - vsrv-admin.py
      - vcli-admin.py
      - tests_local/test_lanfabric_awg_go.py
      - tests_local/test_lanfabric_go_installation.py
      - tests_integration/run_awg_go_ci.py
      - .github/workflows/awg-go-checks.yml
      - deployment/build_go_components.py
      - deployment/publish_go_components.py

permissions:
  contents: read

concurrency:
  group: awg-go-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Получить проверяемые исходники LanFabric
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Получить закреплённый Go-компонент
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: amnezia-vpn/amneziawg-go
          ref: b5928efb6ca19f0153958460c3d141f04abc5c2e
          path: ci-src/go
          persist-credentials: false
      - name: Получить закреплённые управляющие утилиты
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: amnezia-vpn/amneziawg-tools
          ref: ee0f0a9aa34ff0a0da4b3433b9512781cfe02843
          path: ci-src/tools
          persist-credentials: false
      - name: Подготовить закреплённый компилятор Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: false
      - name: Собрать компоненты для одноразового испытания
        run: python3 deployment/build_go_components.py
      - name: Сохранить готовые компоненты для испытаний выпуска
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: awg-go-components
          path: ci-dist/
          retention-days: 7
          if-no-files-found: error

  awg-go-service:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Получить проверяемые исходники
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Получить компоненты той же сборки
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: awg-go-components
          path: ci-dist/
      - name: Подготовить зависимости изолированной машины
        run: sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y iptables-persistent netfilter-persistent
      - name: Проверить чистую установку, удаление и аварийное восстановление
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_REPOSITORY,RUNNER_ENVIRONMENT /usr/bin/python3 tests_integration/run_awg_go_ci.py

  publish-components:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'dilukhin/LanFabric'
    needs: [build, awg-go-service]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Получить проверенный исходный коммит
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Получить проверенные компоненты
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: awg-go-components
          path: ci-dist/
      - name: Опубликовать предварительную поставку компонентов
        env:
          GH_COMPONENT_TOKEN: ${{ github.token }}
        run: python3 deployment/publish_go_components.py
