name: Локальные проверки LanFabric

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: local-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.10', '3.12', '3.13', '3.14.2']
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Получить исходный код проверяемого коммита
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Подготовить Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Проверить модули, справку и регрессионные сценарии
        run: python tests_local/run_local_checks.py
      - name: Проверить ограниченное окружение ACP
        if: ${{ matrix.python-version == '3.14.2' }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          base = {k: os.environ[k] for k in ("SYSTEMROOT", "WINDIR", "TEMP", "TMP", "PATH") if k in os.environ}
          base.update(PYTHONDONTWRITEBYTECODE="1", PYTHONUTF8="1", PYTHONIOENCODING="utf-8")
          print("ACP current environment", flush=True)
          old = subprocess.run([sys.executable, "-B", "tests_local/run_local_checks.py"], env=base, stdin=subprocess.DEVNULL, timeout=180)
          print(f"ACP current environment exit={old.returncode}", flush=True)
          if os.name == "nt" and "USERPROFILE" in os.environ:
              base["USERPROFILE"] = os.environ["USERPROFILE"]
          print("ACP environment with Windows home", flush=True)
          fixed = subprocess.run([sys.executable, "-B", "tests_local/run_local_checks.py"], env=base, stdin=subprocess.DEVNULL, timeout=180)
          print(f"ACP environment with Windows home exit={fixed.returncode}", flush=True)
          sys.exit(fixed.returncode)
